@if (label()) {
  <label [for]="fieldId" [class]="'bip-select-label ' + labelClass()">
    {{ label() }}
    @if (required()) {
      <span aria-hidden="true" class="bip-select-required-mark"> *</span>
    }
  </label>
}
<div class="bip-select-container">
  <select
    [id]="fieldId"
    [class]="'bip-select ' + selectClass()"
    [disabled]="disabled()"
    [required]="required()"
    [attr.aria-invalid]="hasError() || null"
    [attr.aria-describedby]="messageId()"
    (change)="onSelectChange($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
  >
    @if (placeholder()) {
      <option value="" disabled [selected]="value() === ''">{{ placeholder() }}</option>
    }
    @for (option of options(); track option.value) {
      <option [value]="option.value" [disabled]="!!option.disabled" [selected]="option.value === value()">
        {{ option.label }}
      </option>
    }
    @for (group of groups(); track group.label) {
      <optgroup [label]="group.label" [disabled]="!!group.disabled">
        @for (option of group.options; track option.value) {
          <option [value]="option.value" [disabled]="!!option.disabled" [selected]="option.value === value()">
            {{ option.label }}
          </option>
        }
      </optgroup>
    }
  </select>
  <span [class]="chevronClass()" aria-hidden="true">
    <svg viewBox="0 0 16 16" fill="currentColor" class="bip-select-chevron-icon">
      <path
        fill-rule="evenodd"
        d="M4.22 6.22a.75.75 0 011.06 0L8 8.94l2.72-2.72a.75.75 0 111.06 1.06l-3.25 3.25a.75.75 0 01-1.06 0L4.22 7.28a.75.75 0 010-1.06z"
        clip-rule="evenodd"
      />
    </svg>
  </span>
</div>
@if (error() && errorMessage()) {
  <span [id]="errorId" [class]="'bip-select-message bip-select-error-text ' + helperClass()" role="alert">
    {{ errorMessage() }}
  </span>
} @else if (helperText()) {
  <span [id]="errorId" [class]="'bip-select-message bip-select-helper-text ' + helperClass()">
    {{ helperText() }}
  </span>
}
