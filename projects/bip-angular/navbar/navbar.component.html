<ng-content select="bip-navbar-brand" />

<button
  type="button"
  class="bip-navbar-toggle"
  [id]="toggleButtonId"
  [attr.aria-expanded]="isMobileOpen()"
  [attr.aria-controls]="mobileMenuId"
  [attr.aria-label]="isMobileOpen() ? locale().navbar.closeMenu : locale().navbar.openMenu"
  (click)="toggleMobile()"
>
  @if (isMobileOpen()) {
    <svg viewBox="0 0 20 20" fill="currentColor" width="1.25em" height="1.25em" aria-hidden="true">
      <path
        fill-rule="evenodd"
        d="M5.28 4.22a.75.75 0 00-1.06 1.06L8.94 10l-4.72 4.72a.75.75 0 101.06 1.06L10 11.06l4.72 4.72a.75.75 0 101.06-1.06L11.06 10l4.72-4.72a.75.75 0 00-1.06-1.06L10 8.94 5.28 4.22z"
        clip-rule="evenodd"
      />
    </svg>
  } @else {
    <svg viewBox="0 0 20 20" fill="currentColor" width="1.25em" height="1.25em" aria-hidden="true">
      <path
        fill-rule="evenodd"
        d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z"
        clip-rule="evenodd"
      />
    </svg>
  }
</button>

<div
  class="bip-navbar-panel"
  [id]="mobileMenuId"
  [class.bip-navbar-panel--open]="isMobileOpen()"
  [attr.aria-hidden]="!isDesktop() && !isMobileOpen() ? 'true' : null"
  [attr.inert]="!isDesktop() && !isMobileOpen() ? '' : null"
>
  <ng-content select="bip-navbar-nav" />
  <ng-content select="bip-navbar-actions" />
</div>

@if (isMobileOpen() && !isDesktop()) {
  <div
    class="bip-navbar-overlay"
    role="presentation"
    aria-hidden="true"
    (click)="closeMobile()"
  ></div>
}
