@if (label()) {
  <label [for]="fieldId" [class]="'bip-input-label ' + labelClass()">
    {{ label() }}
    @if (required()) {
      <span aria-hidden="true" class="bip-input-required-mark"> *</span>
    }
  </label>
}
<div class="bip-input-container">
  @if (hasStartIcon()) {
    <span class="bip-input-icon-start">
      <ng-content select="[bipInputStartIcon]" />
    </span>
  }
  <input
    [id]="fieldId"
    [class]="'bip-input ' + inputClass()"
    [type]="actualType()"
    [disabled]="disabled()"
    [required]="required()"
    [readOnly]="readonly()"
    [value]="value()"
    [attr.aria-invalid]="hasError() || null"
    [attr.aria-describedby]="messageId()"
    (input)="onInput($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
  />
  @if (hasEndAdornment()) {
    <span class="bip-input-right-adornments">
      <ng-content select="[bipInputEndIcon]" />
      @if (showClear()) {
        <button
          type="button"
          class="bip-input-clear-button"
          (click)="clear()"
          [attr.aria-label]="locale().input.clear"
          tabindex="-1"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      }
      @if (isPassword()) {
        <button
          type="button"
          class="bip-input-password-toggle"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword() ? locale().input.hidePassword : locale().input.showPassword"
          tabindex="-1"
        >
          @if (showPassword()) {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          } @else {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      }
    </span>
  }
</div>
@if (error() && errorMessage()) {
  <span [id]="errorId" [class]="'bip-input-message bip-input-error-text ' + helperClass()" role="alert">
    {{ errorMessage() }}
  </span>
} @else if (helperText()) {
  <span [id]="errorId" [class]="'bip-input-message bip-input-helper-text ' + helperClass()">
    {{ helperText() }}
  </span>
}
