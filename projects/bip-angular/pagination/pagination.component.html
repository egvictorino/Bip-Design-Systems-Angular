@if (totalPages() > 1) {
  <nav class="bip-pagination-nav" [attr.aria-label]="locale().pagination.nav">
    <ul class="bip-pagination-list">
      <li>
        <button
          type="button"
          class="bip-pagination-button bip-pagination-button--arrow"
          [attr.aria-label]="locale().pagination.prevPage"
          [disabled]="disabled() || page() <= 1"
          (click)="goTo(page() - 1)"
        >
          <svg viewBox="0 0 20 20" fill="currentColor" width="1em" height="1em" class="bip-pagination-chevron">
            <path
              fill-rule="evenodd"
              d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
      </li>

      @for (item of pageRange(); track $index) {
        <li>
          @if (item === 'ellipsis') {
            <span class="bip-pagination-ellipsis" aria-hidden="true">&hellip;</span>
          } @else {
            <button
              type="button"
              class="bip-pagination-button"
              [class.bip-pagination-button--active]="item === page()"
              [attr.aria-label]="locale().pagination.page(item)"
              [attr.aria-current]="item === page() ? 'page' : null"
              [disabled]="disabled()"
              (click)="goTo(item)"
            >
              {{ item }}
            </button>
          }
        </li>
      }

      <li>
        <button
          type="button"
          class="bip-pagination-button bip-pagination-button--arrow"
          [attr.aria-label]="locale().pagination.nextPage"
          [disabled]="disabled() || page() >= totalPages()"
          (click)="goTo(page() + 1)"
        >
          <svg viewBox="0 0 20 20" fill="currentColor" width="1em" height="1em" class="bip-pagination-chevron">
            <path
              fill-rule="evenodd"
              d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
      </li>
    </ul>
  </nav>
}
