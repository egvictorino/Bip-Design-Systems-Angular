@if (isMobileOpen()) {
  <div class="bip-sidebar-overlay" role="presentation" aria-hidden="true" (click)="onOverlayClick()"></div>
}

<div
  class="bip-sidebar-panel"
  [class.bip-sidebar-panel--collapsed]="isCollapsed()"
  [class.bip-sidebar-panel--mobile-open]="isMobileOpen()"
  [cdkTrapFocus]="isMobileOpen()"
  [cdkTrapFocusAutoCapture]="isMobileOpen()"
>
  <ng-content />
</div>
