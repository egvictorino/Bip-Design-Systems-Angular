@if (loading()) {
  <div class="bip-stats-card-header">
    <span class="bip-stats-card-loading-bar bip-stats-card-loading-title"></span>
    <span
      class="bip-stats-card-loading-bar bip-stats-card-loading-icon"
      [style.display]="hasIcon() ? '' : 'none'"
    ></span>
  </div>
  <div class="bip-stats-card-value-row">
    <span class="bip-stats-card-loading-bar bip-stats-card-loading-value"></span>
  </div>
  <span class="bip-stats-card-loading-bar bip-stats-card-loading-description"></span>
} @else {
  <div class="bip-stats-card-header">
    <span class="bip-stats-card-title">{{ title() }}</span>
    <span
      class="bip-stats-card-icon-slot"
      [style.display]="hasIcon() ? '' : 'none'"
      aria-hidden="true"
    >
      <ng-content select="[bipStatsCardIcon]" />
    </span>
  </div>

  <div class="bip-stats-card-value-row">
    <span class="bip-stats-card-value">{{ value() }}</span>

    @if (trendDirection(); as direction) {
      <span [class]="trendClasses()" [attr.aria-label]="trendLabel()">
        @switch (direction) {
          @case ('positive') {
            <svg
              viewBox="0 0 16 16"
              fill="currentColor"
              class="bip-stats-card-trend-icon"
              aria-hidden="true"
            >
              <path
                fill-rule="evenodd"
                d="M8 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1-1.06 1.06L9 5.31V12a.75.75 0 0 1-1.5 0V5.31L4.25 8.53a.75.75 0 0 1-1.06-1.06L8 3.22z"
                clip-rule="evenodd"
              />
            </svg>
          }
          @case ('negative') {
            <svg
              viewBox="0 0 16 16"
              fill="currentColor"
              class="bip-stats-card-trend-icon"
              aria-hidden="true"
            >
              <path
                fill-rule="evenodd"
                d="M8 12.78a.75.75 0 0 1-1.06 0L2.69 8.53a.75.75 0 0 1 1.06-1.06L7 10.69V4a.75.75 0 0 1 1.5 0v6.69l3.25-3.22a.75.75 0 1 1 1.06 1.06L8 12.78z"
                clip-rule="evenodd"
              />
            </svg>
          }
          @case ('neutral') {
            <svg
              viewBox="0 0 16 16"
              fill="currentColor"
              class="bip-stats-card-trend-icon"
              aria-hidden="true"
            >
              <path
                fill-rule="evenodd"
                d="M2.75 8a.75.75 0 0 1 .75-.75h9a.75.75 0 0 1 0 1.5h-9A.75.75 0 0 1 2.75 8zm7.72-2.03a.75.75 0 0 1 1.06 0l2.25 2.25a.75.75 0 0 1 0 1.06l-2.25 2.25a.75.75 0 1 1-1.06-1.06L11.94 8l-1.47-1.47a.75.75 0 0 1 0-1.06z"
                clip-rule="evenodd"
              />
            </svg>
          }
        }
        {{ trendText() }}
      </span>
    }
  </div>

  @if (description()) {
    <p class="bip-stats-card-description">{{ description() }}</p>
  }
}
