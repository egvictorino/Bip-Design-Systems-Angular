<ng-content />

    fill="none"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    class="bip-link-external-icon"
    width="0.875em"
    height="0.875em"

  <bip-visually-hidden> {{ locale().link.opensInNewTab }}</bip-visually-hidden>
