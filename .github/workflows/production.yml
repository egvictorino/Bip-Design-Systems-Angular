name: Production Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # deploy manual

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Pre-Production Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  build-production:
    name: Build Production
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Lint del paquete publicado
        run: pnpm lint:package

      - name: Tamaño de bundle por entry point
        run: pnpm size

      - name: Upload production artifact
        uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: dist/bip-angular
          retention-days: 30

  e2e-consumer:
    name: E2E — Published Package Smoke Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run consumer smoke test
        run: pnpm test:e2e

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: [build-production, e2e-consumer]
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write # npm --provenance
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Download production build
        uses: actions/download-artifact@v7
        with:
          name: production-build
          path: dist/bip-angular

      - name: Check if version already published
        id: version-check
        working-directory: dist/bip-angular
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@bip-design-systems/angular@$VERSION" version 2>/dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ @bip-design-systems/angular@$VERSION ya publicada — se omite"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "✅ @bip-design-systems/angular@$VERSION no publicada — se publica"
          fi

      # Se publica desde dist/bip-angular (el paquete ng-packagr), nunca desde la raíz.
      - name: Publish @bip-design-systems/angular
        if: steps.version-check.outputs.already_published == 'false'
        working-directory: dist/bip-angular
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy-storybook:
    name: Deploy Storybook to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-production
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./storybook-static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [deploy-storybook, publish-npm]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./projects/bip-angular/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "body<<CHANGELOG_EOF"
            awk -v ver="## [$VERSION]" '
              index($0, ver) == 1 { found=1; print; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
            echo ""
            echo "### Recursos"
            echo "- [NPM](https://www.npmjs.com/package/@bip-design-systems/angular)"
            echo "- [Storybook](https://egvictorino.github.io/Bip-Design-Systems-Angular/)"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
