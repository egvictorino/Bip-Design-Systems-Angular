name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Token de solo lectura por defecto — ningún job de este workflow publica nada ni necesita
# escribir en el repo. `pull_request` (no `pull_request_target`) ya corre con un token de
# solo lectura y sin secrets para PRs de forks, pero fijarlo explícito documenta la intención
# y cubre también el caso de un PR desde una rama del propio repo.
permissions:
  contents: read

jobs:
  branch-check:
    name: Branch flow check
    runs-on: ubuntu-latest
    steps:
      - name: Check PR target branch
        # TARGET/SOURCE se pasan vía `env`, nunca interpolados directo con ${{ }} dentro del
        # script de `run` — un `head_ref` (el nombre de la rama del PR) es un valor que
        # controla quien abre el PR; interpolado directo en el YAML, algo como
        # `feature/$(curl ...)` es un nombre de rama válido para git y se ejecutaría como
        # parte del script de shell generado. Como variable de entorno, el shell solo ve su
        # valor como texto.
        env:
          TARGET: ${{ github.base_ref }}
          SOURCE: ${{ github.head_ref }}
        run: |
          echo "📋 PR: $SOURCE → $TARGET"

          if [[ "$TARGET" == "main" ]] && [[ "$SOURCE" != "qa" ]] && [[ "$SOURCE" != "hotfix/"* ]]; then
            echo "❌ ERROR: Solo se puede mergear a 'main' desde 'qa' o 'hotfix/*'"
            echo "Debe ser: qa → main  |  hotfix/* → main"
            exit 1
          fi

          if [[ "$TARGET" == "qa" ]] && [[ "$SOURCE" != "dev" ]] && [[ "$SOURCE" != "hotfix/"* ]] && [[ "$SOURCE" != "main" ]]; then
            echo "❌ ERROR: Solo se puede mergear a 'qa' desde 'dev', 'hotfix/*' o 'main'"
            echo "Debe ser: dev → qa  |  hotfix/* → qa  |  main → qa"
            exit 1
          fi

          if [[ "$TARGET" == "dev" ]] && [[ "$SOURCE" != "feature/"* ]] && [[ "$SOURCE" != "release/"* ]] && [[ "$SOURCE" != "hotfix/"* ]] && [[ "$SOURCE" != "main" ]]; then
            echo "❌ ERROR: Solo se puede mergear a 'dev' desde 'feature/*', 'release/*', 'hotfix/*' o 'main'"
            echo "Debe ser: feature/* → dev  |  release/* → dev  |  hotfix/* → dev  |  main → dev"
            exit 1
          fi

          echo "✅ Flujo de branches correcto"

      - name: Check PR title format
        # El título es texto libre del autor del PR: vía env, nunca interpolado en el script.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore|hotfix)(\(.+\))?:\ .+ ]]; then
            echo "⚠️ Recomendación: usa conventional commits"
            echo "Ejemplo: feat(button): agregar variante outline"
          fi

  build-and-test:
    name: Build & Test PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Lint del paquete publicado (exports/types/sideEffects)
        run: pnpm lint:package

      - name: Tamaño de bundle por entry point
        run: pnpm size

  changeset-check:
    name: Changeset Check
    runs-on: ubuntu-latest
    # `release/*` consume los changesets a propósito (`changeset version`), así que no se exige uno.
    if: github.base_ref == 'dev' && !startsWith(github.head_ref, 'release/')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for a changeset
        # BASE_REF vía env por el mismo motivo que en branch-check — es un valor que viene
        # del contexto del PR, nunca se interpola directo en el script.
        #
        # El filtro cubre todo projects/bip-angular/** salvo lo que no se publica (specs,
        # stories, y las carpetas de Storybook/guards): a diferencia de core, un secondary
        # entry point de componente (p. ej. modal/, button/) no tiene una subcarpeta `src/`
        # propia — sus *.component.ts viven directo en la raíz del entry — así que el filtro
        # original ('projects/bip-angular/**/src/**') solo alcanzaba a core/src y al
        # src/public-api.ts raíz, dejando sin exigir changeset a los 50 componentes.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD" -- \
            'projects/bip-angular/**' \
            ':(exclude)projects/bip-angular/**/*.spec.ts' \
            ':(exclude)projects/bip-angular/**/*.stories.ts' \
            ':(exclude)projects/bip-angular/testing/**' \
            ':(exclude)projects/bip-angular/foundations/**')
          if [ -n "$CHANGED" ]; then
            pnpm exec changeset status --since="origin/$BASE_REF"
          else
            echo "Sin cambios en código publicado bajo projects/bip-angular — no se requiere changeset."
          fi

  security-audit:
    name: Security Audit (PR → QA)
    runs-on: ubuntu-latest
    if: github.base_ref == 'qa'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

  visual-regression:
    name: Visual Regression + a11y en navegador
    runs-on: ubuntu-latest
    # Misma imagen que scripts/visual-docker.sh usa en local: mismo Chromium y libc, cero
    # deriva entre "pasa en mi máquina" y "pasa en CI". El tag DEBE coincidir con la versión
    # de @playwright/test en package.json (se suben juntos, ver scripts/visual-docker.sh).
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      # La imagen trae su propio Node (24.x), que `engine-strict=true` rechaza — se instala el
      # Node 22 LTS fijado en .nvmrc, igual que hace scripts/visual-docker.sh.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run visual regression + browser a11y
        run: pnpm exec playwright test --config=playwright.visual.config.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
